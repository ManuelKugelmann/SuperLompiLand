<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creature viewer</title>
<style>
    html, body { margin: 0; height: 100%; background: #062a44; color: #eafcff; font: 600 14px Arial, sans-serif; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #labels div { position: absolute; top: 8px; text-align: center; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #labels small { display: block; font-weight: 400; opacity: 0.8; }
    #bar { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: center; }
    #bar button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; background: #ffe9a8; color: #06343a; cursor: pointer; }
    #bar button.on { background: #7ee08a; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="bar"></div>
<script type="module" src="game/render/viewer.js"></script>
</body>
</html>
