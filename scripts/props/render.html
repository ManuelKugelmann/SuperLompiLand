import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Side-view sprite renderer with an underwater, animated-film look:
// soft sky light from above, warm key, cool rim from behind, sea growth on upward faces.
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

document.body.append(renderer.domElement);
const cache = {};

/** growth: 0..1 how much algae/silt covers upward faces; tint: overall water-aged multiply. */
function weather(root, growth, tint) {
    root.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = o.receiveShadow = true;
