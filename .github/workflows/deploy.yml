name: Deploy to GitHub Pages

# Dev/Release page routing (same model as the board-game prototypes):
#   main           -> https://<owner>.github.io/<repo>/            (RELEASE)
#   <other branch> -> https://<owner>.github.io/<repo>/<slug>/     (DEV PREVIEW)
# keep_files: true => a push only writes its own subfolder; other branches stay.
# Branch deletes are cleaned up by cleanup.yml.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: gh-pages-writer
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

jobs:
  deploy:
    if: github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Compute deploy paths
        id: vars
        run: |
          repo="${{ github.event.repository.name }}"
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          branch="${{ github.ref_name }}"
          if [ "$branch" = "main" ]; then
            dest=""
            base="/$repo/"
            url="https://$owner_lc.github.io/$repo/"
          else
            slug="$(echo "$branch" | sed 's/[^a-zA-Z0-9]/-/g')"
            dest="$slug"
            base="/$repo/$slug/"
            url="https://$owner_lc.github.io/$repo/$slug/"
          fi
          {
            echo "dest=$dest"
            echo "base=$base"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $branch -> ${dest:-<root>}  ($url)"

      - name: Build
        run: npm run build -- --base="${{ steps.vars.outputs.base }}"

      - name: Publish subfolder to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.vars.outputs.dest }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy ${{ github.ref_name }} -> ${{ steps.vars.outputs.dest || ''<root>'' }} (${{ github.sha }})'

      - name: Attach preview URL status
        if: github.ref_name != 'main'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$(printf '{"state":"success","context":"%s","description":"%s","target_url":"%s"}' \
                  "github-pages-preview" "Dev preview deployed" "${{ steps.vars.outputs.url }}")"
