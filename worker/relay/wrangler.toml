name = "lompi-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGINS = "https://manuelkugelmann.github.io,http://localhost:8080,http://localhost:4178"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The Workers free plan needs the SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
